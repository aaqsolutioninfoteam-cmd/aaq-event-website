<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAQ Login - Professional ERP Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* =================================
           MODERN CORPORATE STYLE - TEAL & GRAY
           ================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0f766e;
            --primary-light: #14b8a6;
            --primary-bg: #ccfbf1;
            --secondary-dark: #1e293b;
            --secondary-light: #475569;
            --secondary-bg: #f1f5f9;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-danger: #ef4444;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-light: #f8fafc;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --border: #e2e8f0;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.2;
        }

        h1 { font-size: 2.5rem; }
        h2 { font-size: 2rem; }
        h3 { font-size: 1.5rem; }
        h4 { font-size: 1.25rem; }
        h5 { font-size: 1.1rem; }
        h6 { font-size: 1rem; }

        p {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn:active { transform: translateY(0); }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #0d5f5a, #12a89f);
        }

        .btn-secondary {
            background: var(--secondary-bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
            border-color: var(--secondary-light);
        }

        .btn-outline {
            border: 2px solid var(--primary-dark);
            color: var(--primary-dark);
            background: transparent;
        }

        .btn-outline:hover { background: var(--primary-bg); }

        .btn-success { background: var(--accent-success); color: white; }
        .btn-warning { background: var(--accent-warning); color: white; }
        .btn-danger { background: var(--accent-danger); color: white; }

        .btn-sm {
            padding: var(--spacing-xs) var(--spacing-sm);
            font-size: 0.875rem;
        }

        .btn-lg {
            padding: var(--spacing-md) var(--spacing-lg);
            font-size: 1.1rem;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 var(--spacing-md);
        }

        .card {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-md);
        }

        .card-header {
            border-bottom: 1px solid var(--border);
            padding-bottom: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .card-footer {
            border-top: 1px solid var(--border);
            padding-top: var(--spacing-md);
            margin-top: var(--spacing-md);
        }

        .form-group {
            margin-bottom: var(--spacing-lg);
        }

        label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 500;
            color: var(--text-primary);
        }

        input, textarea, select {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-dark);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
        }

        input::placeholder { color: var(--text-secondary); }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .input-error { border-color: var(--accent-danger) !important; }

        .error-message {
            color: var(--accent-danger);
            font-size: 0.875rem;
            margin-top: var(--spacing-xs);
        }

        .success-message {
            color: var(--accent-success);
            font-size: 0.875rem;
            margin-top: var(--spacing-xs);
        }

        .alert {
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-md);
            border-left: 4px solid;
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border-left-color: var(--accent-success);
            color: #047857;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border-left-color: var(--accent-danger);
            color: #991b1b;
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            border-left-color: var(--accent-warning);
            color: #92400e;
        }

        .alert-info {
            background: rgba(15, 118, 110, 0.1);
            border-left-color: var(--primary-dark);
            color: #0d5f5a;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-lg);
        }

        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }

        .flex {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .flex-column { flex-direction: column; }
        .flex-between { justify-content: space-between; }
        .flex-center { justify-content: center; }
        .flex-end { justify-content: flex-end; }
        .flex-wrap { flex-wrap: wrap; }

        .mt-1 { margin-top: var(--spacing-sm); }
        .mt-2 { margin-top: var(--spacing-md); }
        .mt-3 { margin-top: var(--spacing-lg); }
        .mt-4 { margin-top: var(--spacing-xl); }

        .mb-1 { margin-bottom: var(--spacing-sm); }
        .mb-2 { margin-bottom: var(--spacing-md); }
        .mb-3 { margin-bottom: var(--spacing-lg); }
        .mb-4 { margin-bottom: var(--spacing-xl); }

        .p-1 { padding: var(--spacing-sm); }
        .p-2 { padding: var(--spacing-md); }
        .p-3 { padding: var(--spacing-lg); }
        .p-4 { padding: var(--spacing-xl); }

        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .text-left { text-align: left; }
        .text-justify { text-align: justify; }

        .text-primary { color: var(--primary-dark); }
        .text-secondary { color: var(--text-secondary); }
        .text-light { color: var(--text-light); }
        .text-muted { color: #94a3b8; }

        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .font-medium { font-weight: 500; }
        .font-normal { font-weight: 400; }

        .text-sm { font-size: 0.875rem; }
        .text-md { font-size: 1rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }

        .line-through { text-decoration: line-through; }
        .underline { text-decoration: underline; }

        .hidden { display: none !important; }
        .visible { display: block !important; }

        .opacity-50 { opacity: 0.5; }
        .opacity-75 { opacity: 0.75; }

        .image-upload {
            position: relative;
            display: inline-block;
        }

        .image-upload input[type="file"] { display: none; }

        .upload-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md);
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            color: white;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .upload-label:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .image-preview {
            width: 150px;
            height: 150px;
            border-radius: var(--radius-lg);
            object-fit: cover;
            border: 2px solid var(--border);
            margin-top: var(--spacing-md);
        }

        .upload-progress {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-top: var(--spacing-sm);
        }

        .upload-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-dark), var(--primary-light));
            transition: width 0.3s ease;
        }

        @media (max-width: 1024px) {
            :root { --spacing-xl: 2rem; }
            h1 { font-size: 2rem; }
            h2 { font-size: 1.5rem; }
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .grid-3 { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            :root { --spacing-lg: 1.5rem; --spacing-md: 1rem; }
            h1 { font-size: 1.75rem; }
            h2 { font-size: 1.25rem; }
            h3 { font-size: 1.1rem; }
            .grid { grid-template-columns: 1fr; }
            .grid-2 { grid-template-columns: 1fr; }
            .grid-3 { grid-template-columns: 1fr; }
            .grid-4 { grid-template-columns: 1fr; }
            .flex { flex-direction: column; align-items: flex-start; }
            .btn { width: 100%; }
        }

        @media (max-width: 480px) {
            :root { --spacing-lg: 1rem; --spacing-md: 0.75rem; --radius-lg: 12px; }
            h1 { font-size: 1.5rem; }
            h2 { font-size: 1.1rem; }
            .card { padding: var(--spacing-md); }
        }

        body {
            background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 30px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #0f766e, #14b8a6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
        }

        .login-header h1 {
            font-size: 28px;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #475569;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #0f766e;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .password-group {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 40px;
            cursor: pointer;
            color: #0f766e;
            font-size: 18px;
            background: none;
            border: none;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-me input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #0f766e;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0f766e, #14b8a6);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(15, 118, 110, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: #047857;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: #991b1b;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .remember-forgot {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-briefcase"></i>
                </div>
                <h1>AAQ ERP Login</h1>
                <p>Professional Event Management System</p>
            </div>

            <div id="alertBox" class="alert"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="your@email.com"
                        required
                    >
                </div>

                <div class="form-group password-group">
                    <label class="form-label" for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Enter your password"
                        required
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>

                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" class="login-btn">
                    <span class="loading-spinner" id="loadingSpinner"></span>
                    <span id="btnText">Login</span>
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC8oQaQ051U1lXafwdjjOo38t56WwsdBO4",
            authDomain: "aaq-event-erp.firebaseapp.com",
            projectId: "aaq-event-erp",
            storageBucket: "aaq-event-erp.firebasestorage.app",
            messagingSenderId: "985636664002",
            appId: "1:985636664002:web:4b941d3562609d2058815b",
            measurementId: "G-HHD049KDS8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function sendWelcomeEmail(userEmail, userName) {
            try {
                if (typeof emailjs !== 'undefined') {
                    await emailjs.send("service_aaq_events", "template_welcome", {
                        to_email: userEmail,
                        user_name: userName,
                        company_name: "A.A.Q Solutions & Outsourcing",
                        website_url: window.location.origin
                    });
                }
                return true;
            } catch(e) {
                console.log("Email notifications fallback triggered.");
                return false;
            }
        }

        // Toggle password visibility
        window.togglePassword = function() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        };

        // Show alert
        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert show alert-${type}`;
            
            if (type === 'success') {
                setTimeout(() => {
                    alertBox.classList.remove('show');
                }, 3000);
            }
        }

        // Handle Login
        window.handleLogin = async function(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.querySelector('.login-btn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const btnText = document.getElementById('btnText');

            // Disable button and show loading
            loginBtn.disabled = true;
            loadingSpinner.style.display = 'inline-block';
            btnText.textContent = 'Logging in...';

            try {
                // Admin check via Firebase 'admins' collection (no hardcoded emails)
                const adminQuery = query(collection(db, 'admins'), where('email', '==', email));
                const adminSnap = await getDocs(adminQuery);

                if (!adminSnap.empty) {
                    let adminFound = false;
                    adminSnap.forEach(async (adminDoc) => {
                        const adminData = adminDoc.data();
                        const hashedInput = await hashPassword(password);
                        if (adminData.password === hashedInput || adminData.password === password) {
                            adminFound = true;
                        }
                    });

                    // Small delay to let forEach finish
                    await new Promise(r => setTimeout(r, 100));

                    if (adminFound) {
                        const adminSession = {
                            email: email,
                            role: 'ADMIN',
                            name: 'Administrator',
                            position: 'System Administrator'
                        };

                        localStorage.setItem('loggedUser', 'Admin');
                        localStorage.setItem('userRole', 'ADMIN');
                        localStorage.setItem('currentUser', JSON.stringify(adminSession));
                        localStorage.setItem('activeStaffUser', JSON.stringify(adminSession));

                        if (rememberMe) {
                            localStorage.setItem('rememberEmail', email);
                        }

                        showAlert('✅ Welcome Admin!', 'success');
                        setTimeout(() => {
                            window.location.href = 'admin.html';
                        }, 1000);
                        return;
                    }
                }

                // Staff check
                const q = query(
                    collection(db, 'staffs'),
                    where('email', '==', email)
                );

                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    throw new Error('User not found');
                }

                let found = false;
                let userData = null;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const hashedInput = await hashPassword(password);
                    if (data.password === hashedInput || data.password === password) {
                        found = true;
                        userData = {
                            id: doc.id,
                            ...data
                        };
                    }
                });

                if (!found) {
                    throw new Error('Invalid password');
                }

                // SUCCESSFUL LOGIN - INTERLOCK FIX WITH DASHBOARD ENGINE
                const staffSessionData = {
                    name: userData.staffName || 'Staff Member',
                    position: userData.position || 'Field Worker',
                    photoUrl: userData.photoURL || 'https://i.imgur.com/6VBx3io.png'
                };

                // Saving standard legacy tokens
                localStorage.setItem('staffId', userData.id);
                localStorage.setItem('staffName', userData.staffName || 'Staff');
                localStorage.setItem('staffEmail', userData.email);
                localStorage.setItem('staffPhoto', userData.photoURL || '');
                localStorage.setItem('userRole', 'STAFF');
                localStorage.setItem('loggedUser', userData.staffName || 'Staff');
                localStorage.setItem('currentUser', JSON.stringify(userData));
                
                // CRITICAL FIXED: Match exactly what dashboard.html requires!
                localStorage.setItem('activeStaffUser', JSON.stringify(staffSessionData));

                if (rememberMe) {
                    localStorage.setItem('rememberEmail', email);
                }

                // Send welcome notification
                try {
                    await sendWelcomeEmail(email, userData.staffName || 'Staff');
                } catch(e) {
                    console.log("Email notifications fallback triggered.");
                }

                showAlert('✅ Welcome back, ' + (userData.staffName || 'Staff'), 'success');
                setTimeout(() => {
                    window.location.href = 'staff-dashboard.html';
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                showAlert('❌ ' + (error.message || 'Login failed. Please try again.'), 'error');
            } finally {
                // Re-enable button
                loginBtn.disabled = false;
                loadingSpinner.style.display = 'none';
                btnText.textContent = 'Login';
            }
        };

        // Pre-fill remembered email
        window.addEventListener('DOMContentLoaded', () => {
            const rememberedEmail = localStorage.getItem('rememberEmail');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('rememberMe').checked = true;
            }
        });
    </script>
</body>
</html>
