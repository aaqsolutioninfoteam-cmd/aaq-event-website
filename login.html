<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAQ Login - Professional ERP Panel</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* =================================
           PREMIUM WORLD-CLASS LOGIN STYLE
           Think Linear · Vercel · Stripe
           ================================= */

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        :root {
            --primary: #d97706;
            --primary-dark: #b45309;
            --primary-light: #f59e0b;
            --bg-page: #f1f5f9;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --success-border: #a7f3d0;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ── Body & Background ── */
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            background-size: 400% 400%;
            animation: gradient-shift 15s ease infinite;
            color: var(--text-heading);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
            overflow: hidden;
        }

        /* ── Decorative Background Blobs ── */
        body::before {
            content: '';
            position: fixed;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -120px;
            left: -120px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Login Container ── */
        .login-container {
            width: 100%;
            max-width: 440px;
            margin: 60px auto;
            position: relative;
            z-index: 1;
        }

        /* ── Login Card (Glassmorphism) ── */
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
            padding: 48px 40px;
            animation: scaleIn 0.6s ease;
        }

        /* ── Header / Logo ── */
        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 30px;
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.2);
            animation: float 3s ease-in-out infinite;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-heading);
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            font-weight: 400;
            margin-bottom: 0;
        }

        /* ── Form Group ── */
        .form-group {
            position: relative;
            margin-bottom: 22px;
            animation: fadeInUp 0.5s ease backwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }

        /* ── Labels ── */
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
            letter-spacing: 0.1px;
        }

        .form-label i {
            margin-right: 4px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ── Input Fields ── */
        .form-input {
            width: 100%;
            padding: 14px 16px 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            background: #f8fafc;
            color: #0f172a;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .form-input:focus {
            border-color: #d97706;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.08);
        }

        .form-input:hover:not(:focus) {
            border-color: #cbd5e1;
            background: #ffffff;
        }

        /* ── Password Group ── */
        .password-group {
            position: relative;
        }

        .password-group .form-input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(10%);
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            font-size: 16px;
            padding: 4px;
            line-height: 1;
        }

        .toggle-password:hover {
            color: #d97706;
        }

        /* ── Remember Me & Forgot Row ── */
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            border-radius: 4px;
        }

        /* ── Login Button ── */
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: fadeInUp 0.5s ease 0.3s backwards;
        }

        .login-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            background-size: 200% 100%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(217, 119, 6, 0.35);
        }

        .login-btn:hover::after {
            opacity: 1;
            animation: shimmer 1.5s ease infinite;
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-btn:disabled::after {
            display: none;
        }

        /* ── Loading Spinner ── */
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        /* ── Alerts ── */
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 10px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .alert.show {
            display: flex;
        }

        .alert-success {
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        /* ── Utility Classes (kept for JS compatibility) ── */
        .hidden { display: none !important; }
        .visible { display: block !important; }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            body {
                padding: 16px;
                align-items: flex-start;
                padding-top: 40px;
            }

            .login-container {
                margin: 30px 16px;
            }

            .login-card {
                padding: 32px 24px;
                border-radius: 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-logo {
                width: 64px;
                height: 64px;
                font-size: 26px;
            }

            .remember-forgot {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }

        /* === CHANGE PASSWORD MODAL === */
        .cpw-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15,23,42,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            justify-content: center; align-items: center; z-index: 99999; padding: 20px;
        }
        .cpw-overlay.show { display: flex; }
        .cpw-box {
            background: rgba(255,255,255,0.8); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.8); border-radius: 22px; padding: 28px;
            width: 100%; max-width: 420px; box-shadow: 0 30px 60px rgba(2,6,23,0.25);
            animation: cpwIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes cpwIn { from { transform: translateY(24px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        .cpw-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .cpw-header h2 { font-size: 19px; font-weight: 700; color: #0f172a; }
        .cpw-close { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 9px; cursor: pointer; font-size: 18px; color: #64748b; transition: all 0.2s; }
        .cpw-close:hover { background: #fee2e2; color: #ef4444; transform: rotate(90deg); }
        .cpw-field { margin-bottom: 14px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-briefcase"></i>
                </div>
                <h1>AAQ ERP Login</h1>
                <p>Professional Event Management System</p>
            </div>

            <div id="alertBox" class="alert"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="your@email.com"
                        required
                    >
                </div>

                <div class="form-group password-group">
                    <label class="form-label" for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Enter your password"
                        required
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>

                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="javascript:void(0)" onclick="openChangePw()" style="color:#d97706; font-size:13px; font-weight:600; text-decoration:none;"><i class="fas fa-key"></i> Change Password</a>
                </div>

                <button type="submit" class="login-btn">
                    <span class="loading-spinner" id="loadingSpinner"></span>
                    <span id="btnText">Login</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Change / Reset Password Modal -->
    <div class="cpw-overlay" id="changePwModal">
        <div class="cpw-box">
            <div class="cpw-header">
                <h2><i class="fas fa-key" style="color:#d97706;"></i> Change Password</h2>
                <button class="cpw-close" onclick="closeChangePw()">&times;</button>
            </div>
            <div id="cpwAlert" class="alert" style="margin-bottom:14px;"></div>
            <div class="cpw-field">
                <label class="form-label" for="cpwEmail"><i class="fas fa-envelope"></i> Account Email</label>
                <input type="email" id="cpwEmail" class="form-input" placeholder="your@email.com">
            </div>
            <div class="cpw-field">
                <label class="form-label" for="cpwNew"><i class="fas fa-lock"></i> New Password</label>
                <input type="password" id="cpwNew" class="form-input" placeholder="Enter new password">
            </div>
            <div class="cpw-field">
                <label class="form-label" for="cpwConfirm"><i class="fas fa-lock"></i> Confirm New Password</label>
                <input type="password" id="cpwConfirm" class="form-input" placeholder="Confirm new password">
            </div>
            <button class="login-btn" style="width:100%;" onclick="doChangePassword()">
                <span id="cpwBtnText">Update Password</span>
            </button>
            <p style="font-size:12px; color:#94a3b8; margin-top:12px;">Applies to Staff accounts and Administrator accounts. Password is stored securely (hashed).</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC8oQaQ051U1lXafwdjjOo38t56WwsdBO4",
            authDomain: "aaq-event-erp.firebaseapp.com",
            projectId: "aaq-event-erp",
            storageBucket: "aaq-event-erp.firebasestorage.app",
            messagingSenderId: "985636664002",
            appId: "1:985636664002:web:4b941d3562609d2058815b",
            measurementId: "G-HHD049KDS8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function sendWelcomeEmail(userEmail, userName) {
            try {
                if (typeof emailjs !== 'undefined') {
                    await emailjs.send("service_aaq_events", "template_welcome", {
                        to_email: userEmail,
                        user_name: userName,
                        company_name: "A.A.Q Solutions & Outsourcing",
                        website_url: window.location.origin
                    });
                }
                return true;
            } catch(e) {
                console.log("Email notifications fallback triggered.");
                return false;
            }
        }

        // Toggle password visibility
        window.togglePassword = function() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        };

        // Show alert
        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert show alert-${type}`;
            
            if (type === 'success') {
                setTimeout(() => {
                    alertBox.classList.remove('show');
                }, 3000);
            }
        }

        // Handle Login
        window.handleLogin = async function(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.querySelector('.login-btn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const btnText = document.getElementById('btnText');

            // Disable button and show loading
            loginBtn.disabled = true;
            loadingSpinner.style.display = 'inline-block';
            btnText.textContent = 'Logging in...';

            try {
                // Admin check via Firebase 'admins' collection
                const adminQuery = query(collection(db, 'admins'), where('email', '==', email));
                const adminSnap = await getDocs(adminQuery);

                if (!adminSnap.empty) {
                    let adminData = null;
                    for (const adminDoc of adminSnap.docs) {
                        const data = adminDoc.data();
                        const hashedInput = await hashPassword(password);
                        if (data.password === hashedInput || data.password === password) {
                            adminData = data;
                        }
                    }

                    if (adminData) {
                        const adminRole = adminData.role || 'ADMIN';
                        const adminSession = {
                            email: email,
                            role: adminRole,
                            name: adminData.name || 'Administrator',
                            position: adminData.position || 'System Administrator'
                        };

                        localStorage.setItem('loggedUser', adminData.name || 'Admin');
                        localStorage.setItem('userRole', adminRole);
                        localStorage.setItem('currentUser', JSON.stringify(adminSession));
                        localStorage.setItem('activeStaffUser', JSON.stringify(adminSession));

                        if (rememberMe) {
                            localStorage.setItem('rememberEmail', email);
                        }

                        showAlert('✅ Welcome ' + (adminData.name || 'Admin') + '!', 'success');
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1000);
                        return;
                    }
                }

                // Staff check - reads role from Firebase staffs collection
                const q = query(
                    collection(db, 'staffs'),
                    where('email', '==', email)
                );

                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    throw new Error('User not found');
                }

                let found = false;
                let userData = null;

                for (const doc of querySnapshot.docs) {
                    const data = doc.data();
                    const hashedInput = await hashPassword(password);
                    if (data.password === hashedInput || data.password === password) {
                        found = true;
                        userData = {
                            id: doc.id,
                            ...data
                        };
                    }
                }

                if (!found) {
                    throw new Error('Invalid password');
                }

                // Staff role from Firebase (default: CREW)
                const staffRole = userData.role || 'CREW';

                const staffSessionData = {
                    name: userData.staffName || 'Staff Member',
                    position: userData.position || 'Field Worker',
                    photoUrl: userData.photoURL || 'https://i.imgur.com/6VBx3io.png',
                    role: staffRole
                };

                localStorage.setItem('staffId', userData.id);
                localStorage.setItem('staffName', userData.staffName || 'Staff');
                localStorage.setItem('staffEmail', userData.email);
                localStorage.setItem('staffPhoto', userData.photoURL || '');
                localStorage.setItem('userRole', staffRole);
                localStorage.setItem('loggedUser', userData.staffName || 'Staff');
                localStorage.setItem('currentUser', JSON.stringify(userData));
                localStorage.setItem('activeStaffUser', JSON.stringify(staffSessionData));

                if (rememberMe) {
                    localStorage.setItem('rememberEmail', email);
                }

                // Send welcome notification
                try {
                    await sendWelcomeEmail(email, userData.staffName || 'Staff');
                } catch(e) {
                    console.log("Email notifications fallback triggered.");
                }

                showAlert('✅ Welcome back, ' + (userData.staffName || 'Staff'), 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                showAlert('❌ ' + (error.message || 'Login failed. Please try again.'), 'error');
            } finally {
                // Re-enable button
                loginBtn.disabled = false;
                loadingSpinner.style.display = 'none';
                btnText.textContent = 'Login';
            }
        };

        // Pre-fill remembered email
        window.addEventListener('DOMContentLoaded', () => {
            const rememberedEmail = localStorage.getItem('rememberEmail');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('rememberMe').checked = true;
            }
        });

        // === CHANGE / RESET PASSWORD ===
        window.openChangePw = function(){
            document.getElementById('cpwAlert').className = 'alert';
            document.getElementById('cpwAlert').textContent = '';
            document.getElementById('cpwNew').value = '';
            document.getElementById('cpwConfirm').value = '';
            document.getElementById('cpwEmail').value = document.getElementById('email').value.trim() || '';
            document.getElementById('changePwModal').classList.add('show');
        };
        window.closeChangePw = function(){
            document.getElementById('changePwModal').classList.remove('show');
        };

        window.doChangePassword = async function(){
            const email = document.getElementById('cpwEmail').value.trim();
            const newPw = document.getElementById('cpwNew').value;
            const confirmPw = document.getElementById('cpwConfirm').value;
            const alertBox = document.getElementById('cpwAlert');
            const btn = document.getElementById('cpwBtnText');

            const flash = (msg, type) => {
                alertBox.textContent = msg;
                alertBox.className = 'alert show alert-' + (type || 'error');
            };

            if(!email || !newPw || !confirmPw){
                flash('Please fill in all fields.', 'error'); return;
            }
            if(newPw.length < 6){
                flash('Password must be at least 6 characters.', 'error'); return;
            }
            if(newPw !== confirmPw){
                flash('Passwords do not match.', 'error'); return;
            }

            btn.textContent = 'Updating...';
            try {
                const hashed = await hashPassword(newPw);

                // Try staffs collection first
                const staffQ = query(collection(db, 'staffs'), where('email', '==', email));
                const staffSnap = await getDocs(staffQ);
                if(!staffSnap.empty){
                    for(const sdoc of staffSnap.docs){
                        await updateDoc(doc(db, 'staffs', sdoc.id), { password: hashed });
                    }
                    flash('✅ Password updated successfully for staff account.', 'success');
                    setTimeout(closeChangePw, 1800);
                    return;
                }

                // Try admins collection
                const adminQ = query(collection(db, 'admins'), where('email', '==', email));
                const adminSnap = await getDocs(adminQ);
                if(!adminSnap.empty){
                    for(const adoc of adminSnap.docs){
                        await updateDoc(doc(db, 'admins', adoc.id), { password: hashed });
                    }
                    flash('✅ Administrator password updated successfully.', 'success');
                    setTimeout(closeChangePw, 1800);
                    return;
                }

                flash('No account found with this email.', 'error');
            } catch(e) {
                console.error('Change password error:', e);
                flash('❌ Failed to update password. Try again.', 'error');
            } finally {
                btn.textContent = 'Update Password';
            }
        };
    </script>

<!-- Back-button guard: if already logged in, skip login page -->
<script>
    window.addEventListener('pageshow', function(e) {
        if (e.persisted) {
            var user = localStorage.getItem('activeStaffUser') || localStorage.getItem('currentUser') || localStorage.getItem('userRole');
            if (user) { window.location.replace('dashboard.html'); }
        }
    });
</script>
