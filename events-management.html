<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>
AAQ Admin Event Management
</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

@keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes scaleIn { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }
@keyframes slideDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Plus Jakarta Sans',sans-serif;
}

body{

background-color:#eef1f6;
background-image:
radial-gradient(at 10% 20%, rgba(59,130,246,0.15) 0%, transparent 45%),
radial-gradient(at 80% 10%, rgba(168,85,247,0.12) 0%, transparent 45%),
radial-gradient(at 50% 80%, rgba(16,185,129,0.12) 0%, transparent 45%),
radial-gradient(at 90% 70%, rgba(245,158,11,0.14) 0%, transparent 45%),
radial-gradient(at 20% 60%, rgba(99,102,241,0.12) 0%, transparent 45%);
background-attachment:fixed;

min-height:100vh;

padding:24px;

color:#0f172a;

}

.container{

max-width:1400px;

margin:auto;

}

h1{

background:rgba(255,255,255,0.6);
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.7);
border-radius:20px;
padding:20px 28px;
margin-bottom:24px;
font-size:22px;
font-weight:800;
color:#0f172a;
display:flex;
flex-direction:column;
gap:4px;
animation:fadeInUp 0.5s ease;
box-shadow:0 8px 30px rgba(15,23,42,0.06);

}

h1::after{

content:'Manage events, crew posts, and staff assignments';
font-size:13px;
font-weight:500;
color:#94a3b8;
display:block;
margin-top:2px;

}

.form-box{

background:rgba(255,255,255,0.6);
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
padding:30px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.7);
box-shadow:0 8px 30px rgba(15,23,42,0.06);
margin-bottom:25px;
animation:fadeInUp 0.5s ease;

}

.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:15px;

}

input,
select{

width:100%;

padding:14px 16px;

border:1px solid rgba(226,232,240,0.9);

border-radius:12px;

background:rgba(255,255,255,0.55);
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);

color:#0f172a;

margin-top:10px;
font-family:'Plus Jakarta Sans',sans-serif;
font-size:14px;
transition:all 0.2s ease;

}

input:focus,
select:focus{

outline:none;
border-color:#d97706;
background:rgba(255,255,255,0.7);
box-shadow:0 0 0 3px rgba(217,119,6,0.1);

}

button{

padding:14px;

border:1px solid rgba(255,255,255,0.25);
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);

border-radius:12px;

cursor:pointer;

font-weight:700;

margin-top:10px;
font-family:'Plus Jakarta Sans',sans-serif;
transition:all 0.3s cubic-bezier(0.4,0,0.2,1);

}

button:active{

transform:scale(0.97);

}

.add-btn{

background:linear-gradient(135deg, #3b82f6, #2563eb);
color:white;
width:100%;
box-shadow:0 4px 12px rgba(59,130,246,0.3);

}

.add-btn:hover{

transform:translateY(-2px);
box-shadow:0 8px 20px rgba(59,130,246,0.4);

}

.save-btn{

background:linear-gradient(135deg, #10b981, #059669);
color:white;
width:100%;
box-shadow:0 4px 12px rgba(16,185,129,0.3);

}

.save-btn:hover{

transform:translateY(-2px);
box-shadow:0 8px 20px rgba(16,185,129,0.4);

}

.edit-btn{

background:linear-gradient(135deg, #f59e0b, #d97706);
color:white;
padding:10px 20px;
box-shadow:0 4px 12px rgba(245,158,11,0.25);

}

.edit-btn:hover{

transform:translateY(-2px);
box-shadow:0 8px 20px rgba(245,158,11,0.35);

}

.remove-btn{

background:linear-gradient(135deg, #ef4444, #dc2626);
color:white;
padding:5px 14px;
border-radius:8px;
font-size:13px;
box-shadow:0 4px 10px rgba(239,68,68,0.25);

}

.remove-btn:hover{

transform:translateY(-1px);
box-shadow:0 6px 16px rgba(239,68,68,0.35);

}

.post-box{

background:rgba(255,255,255,0.6);
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
padding:24px;
border-radius:18px;
margin-top:20px;
border:1px solid rgba(255,255,255,0.7);
box-shadow:0 8px 30px rgba(15,23,42,0.06);
animation:fadeInUp 0.5s ease;

}

.post-box h2{

font-size:16px;
font-weight:700;
color:#1e293b;
margin-bottom:8px;

}

.staff-item{

display:flex;

justify-content:space-between;

align-items:center;

background:rgba(255,255,255,0.55);
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);

padding:12px 16px;

border-radius:12px;

margin-top:10px;

border:1px solid rgba(255,255,255,0.7);
transition:all 0.2s ease;

}

.staff-item:hover{

border-color:rgba(255,255,255,0.9);
box-shadow:0 2px 8px rgba(15,23,42,0.04);

}

.event-card{

background:rgba(255,255,255,0.6);
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
padding:28px;
border-radius:20px;
margin-top:20px;
border:1px solid rgba(255,255,255,0.7);
box-shadow:0 8px 30px rgba(15,23,42,0.06);
animation:fadeInUp 0.5s ease;
transition:all 0.3s cubic-bezier(0.4,0,0.2,1);

}

.event-card:hover{

transform:translateY(-3px);
box-shadow:0 12px 30px rgba(15,23,42,0.1);

}

.event-card h2{

font-size:18px;
font-weight:800;
color:#0f172a;
margin-bottom:8px;

}

.event-card p{

font-size:14px;
color:#475569;
line-height:1.6;

}

        /* === PREMIUM TOAST NOTIFICATIONS === */
        #toastWrap { position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
        .toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; min-width: 280px; max-width: 360px; padding: 14px 18px; border-radius: 14px; color: #fff; font-size: 13px; font-weight: 600; line-height: 1.4; box-shadow: 0 12px 30px rgba(2,6,23,0.25); animation: toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1); position: relative; overflow: hidden; }
        .toast::after { content: ''; position: absolute; bottom: 0; left: 0; height: 3px; width: 100%; background: rgba(255,255,255,0.4); animation: toastBar 3s linear forwards; }
        .toast.out { animation: toastOut 0.35s ease forwards; }
        .toast .t-ic { width: 32px; height: 32px; border-radius: 9px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .toast-success { background: linear-gradient(135deg, #10b981, #059669); }
        .toast-error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .toast-warning { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .toast-info { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        @keyframes toastIn { from { transform: translateX(120%) scale(0.9); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }
        @keyframes toastOut { to { transform: translateX(120%); opacity: 0; } }
        @keyframes toastBar { from { width: 100%; } to { width: 0%; } }

</style>
</head>
<body>

<!-- Auth Guard: ADMIN, MANAGER, COORDINATOR only -->
<script>
    (function(){ var role = localStorage.getItem('userRole'); if(!['ADMIN','MANAGER','COORDINATOR'].includes(role)){ window.location.replace('login.html'); } })();
</script>

<div class="container">

<h1>
AAQ Admin Event Management
</h1>

<div class="form-box">

<div class="grid">

<input
type="text"
id="eventName"
placeholder="Event Name">

<input
type="text"
id="eventAddress"
placeholder="Event Address">

<input
type="date"
id="startDate">

<input
type="date"
id="endDate">

<input
type="text"
id="eventCoordinator"
placeholder="Event Coordinator">

<input
type="text"
id="accessManager"
placeholder="Access Manager">

<input
type="text"
id="technicalTeam"
placeholder="Technical Team">

</div>

<div id="postContainer"></div>

<button
class="add-btn"
id="addPostBtn">

+ Add Event Crew Post

</button>

<button
class="save-btn"
id="saveEventBtn">

Save Event

</button>

</div>

<div id="eventList"></div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
addDoc,
updateDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyC8oQaQ051U1lXafwdjjOo38t56WwsdBO4",

authDomain:
"aaq-event-erp.firebaseapp.com",

projectId:
"aaq-event-erp",

storageBucket:
"aaq-event-erp.firebasestorage.app",

messagingSenderId:
"985636664002",

appId:
"1:985636664002:web:4b941d3562609d2058815b"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

let currentEditId = null;

let totalPosts = 0;

async function loadStaffOptions(select){

const querySnapshot =
await getDocs(
collection(db,"staffs")
);

let options =
"<option value=''>Select Staff</option>";

querySnapshot.forEach((docItem)=>{

const staff =
docItem.data();

options += `

<option value="${staff.email}">
${staff.staffName} - ${staff.email}
</option>

`;

});

select.innerHTML = options;

}

async function createPost(postData = null){

totalPosts++;

const postBox =
document.createElement("div");

postBox.className =
"post-box";

postBox.innerHTML = `

<h2>
Crew Post ${totalPosts}
</h2>

<div class="grid">

<input
type="text"
class="crewPost"
placeholder="Crew Post">

<input
type="text"
class="dutyArea"
placeholder="Duty Area">

<input
type="text"
class="coordinator"
placeholder="Coordinator">

<select class="staffSelect"></select>

</div>

<button class="add-btn">
Add Staff
</button>

<div class="selectedStaffList"></div>

`;

document
.getElementById("postContainer")
.appendChild(postBox);

const select =
postBox.querySelector(".staffSelect");

await loadStaffOptions(select);

if(postData){

postBox.querySelector(".crewPost").value =
postData.crewPost || "";

postBox.querySelector(".dutyArea").value =
postData.dutyArea || "";

postBox.querySelector(".coordinator").value =
postData.coordinator || "";

const list =
postBox.querySelector(".selectedStaffList");

(postData.staffEmails || []).forEach((email)=>{

addStaffItem(list,email);

});

}

postBox
.querySelector(".add-btn")
.addEventListener("click",()=>{

const email = select.value;

if(!email){

alert("Select Staff");

return;

}

const list =
postBox.querySelector(".selectedStaffList");

const already =
Array.from(
list.querySelectorAll(".staff-email")
).some(

item =>

item.innerText.trim() ===
email.trim()

);

if(already){

alert("Already Added");

return;

}

addStaffItem(list,email);

});

}

function addStaffItem(list,email){

const div =
document.createElement("div");

div.className =
"staff-item";

div.innerHTML = `

<span class="staff-email">
${email}
</span>

<button class="remove-btn">
Remove
</button>

`;

div
.querySelector(".remove-btn")
.addEventListener("click",()=>{

div.remove();

});

list.appendChild(div);

}

async function saveEvent(){

const posts = [];

document
.querySelectorAll(".post-box")
.forEach((post)=>{

const emails = [];

post
.querySelectorAll(".staff-email")
.forEach((item)=>{

emails.push(
item.innerText.trim()
);

});

posts.push({

crewPost:
post.querySelector(".crewPost").value,

dutyArea:
post.querySelector(".dutyArea").value,

coordinator:
post.querySelector(".coordinator").value,

staffEmails:
emails

});

});

const eventData = {

eventName:
document.getElementById("eventName").value,

eventAddress:
document.getElementById("eventAddress").value,

startDate:
document.getElementById("startDate").value,

endDate:
document.getElementById("endDate").value,

eventCoordinator:
document.getElementById("eventCoordinator").value,

accessManager:
document.getElementById("accessManager").value,

technicalTeam:
document.getElementById("technicalTeam").value,

posts

};

try{

if(currentEditId){

await updateDoc(
doc(db,"events",currentEditId),
eventData
);

showToast("Event Updated", 'success');

}else{

await addDoc(
collection(db,"events"),
eventData
);

showToast("Event Saved", 'success');

}

resetForm();

await loadEvents();

}catch(error){

console.log(error);

alert(error.message);

}

}

function resetForm(){

currentEditId = null;

document.getElementById("eventName").value = "";

document.getElementById("eventAddress").value = "";

document.getElementById("startDate").value = "";

document.getElementById("endDate").value = "";

document.getElementById("eventCoordinator").value = "";

document.getElementById("accessManager").value = "";

document.getElementById("technicalTeam").value = "";

document.getElementById("postContainer").innerHTML = "";

totalPosts = 0;

createPost();

}

async function editEvent(id){

currentEditId = id;

const querySnapshot =
await getDocs(
collection(db,"events")
);

querySnapshot.forEach(async(docItem)=>{

if(docItem.id === id){

const event =
docItem.data();

document.getElementById("eventName").value =
event.eventName || "";

document.getElementById("eventAddress").value =
event.eventAddress || "";

document.getElementById("startDate").value =
event.startDate || "";

document.getElementById("endDate").value =
event.endDate || "";

document.getElementById("eventCoordinator").value =
event.eventCoordinator || "";

document.getElementById("accessManager").value =
event.accessManager || "";

document.getElementById("technicalTeam").value =
event.technicalTeam || "";

document.getElementById("postContainer").innerHTML = "";

totalPosts = 0;

for(const post of (event.posts || [])){

await createPost(post);

}

window.scrollTo({

top:0,
behavior:"smooth"

});

}

});

}

async function loadEvents(){

const querySnapshot =
await getDocs(
collection(db,"events")
);

let html = "";

querySnapshot.forEach((docItem)=>{

const event =
docItem.data();

const id =
docItem.id;

html += `

<div class="event-card">

<h2>
${event.eventName || ""}
</h2>

<p>
📍 ${event.eventAddress || ""}
</p>

<p>
📅 ${event.startDate || ""}
To
${event.endDate || ""}
</p>

${(event.posts || []).map(post=>`

<div class="staff-item">

<div>

<p>
💼 ${post.crewPost || ""}
</p>

<p>
📍 ${post.dutyArea || ""}
</p>

<p>
👨 ${post.coordinator || ""}
</p>

<p>
👥 ${(post.staffEmails || []).join(", ")}
</p>

</div>

</div>

`).join("")}

<br>

<button
class="edit-btn"
data-id="${id}">

Edit Event

</button>

</div>

`;

});

document
.getElementById("eventList")
.innerHTML = html;

document
.querySelectorAll(".edit-btn")
.forEach((btn)=>{

btn.addEventListener("click",()=>{

editEvent(btn.dataset.id);

});

});

}

document
.getElementById("addPostBtn")
.addEventListener("click",()=>{

createPost();

});

document
.getElementById("saveEventBtn")
.addEventListener("click",()=>{

saveEvent();

});

createPost();

loadEvents();

</script>

<!-- Back-button auth guard -->
<script>
    window.addEventListener('pageshow', function(e) {
        if (e.persisted) { window.location.replace(window.location.href); }
    });
    window.addEventListener('popstate', function() {
        var user = localStorage.getItem('activeStaffUser') || localStorage.getItem('currentUser') || localStorage.getItem('userRole');
        if (!user) { window.location.replace('login.html'); }
    });
</script>

<script>
const obs = new IntersectionObserver((entries) => {
    entries.forEach((e, i) => {
        if (e.isIntersecting) { e.target.style.animation = `fadeInUp 0.5s ease ${i * 0.1}s forwards`; e.target.style.opacity = '0'; obs.unobserve(e.target); }
    });
}, { threshold: 0.1 });
document.querySelectorAll('.form-box, .event-card, .post-box').forEach(el => obs.observe(el));

// === PREMIUM TOAST NOTIFICATIONS ===
(function(){
    let wrap = document.getElementById('toastWrap');
    if(!wrap){ wrap = document.createElement('div'); wrap.id = 'toastWrap'; document.body.appendChild(wrap); }
    const icons = { success: '&#10003;', error: '&#10005;', warning: '&#9888;', info: '&#9432;' };
    window.showToast = function(msg, type){
        type = type || 'info';
        const t = document.createElement('div');
        t.className = 'toast toast-' + type;
        t.innerHTML = '<span class="t-ic">' + (icons[type]||icons.info) + '</span><span>' + msg + '</span>';
        wrap.appendChild(t);
        setTimeout(function(){ t.classList.add('out'); setTimeout(function(){ t.remove(); }, 400); }, 3000);
    };
    window.alert = function(msg){ showToast(msg, 'warning'); };
})();
</script>
</body>
</html>
