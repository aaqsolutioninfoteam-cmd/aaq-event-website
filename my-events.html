<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>
My Events
</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Plus Jakarta Sans',sans-serif;
}

body{
background:#eef1f6;
background-image:radial-gradient(at 10% 20%, rgba(59,130,246,0.15) 0%, transparent 45%), radial-gradient(at 80% 10%, rgba(139,92,246,0.14) 0%, transparent 45%), radial-gradient(at 60% 80%, rgba(16,185,129,0.12) 0%, transparent 45%), radial-gradient(at 30% 70%, rgba(245,158,11,0.13) 0%, transparent 45%), radial-gradient(at 90% 60%, rgba(59,130,246,0.10) 0%, transparent 45%);
background-attachment:fixed;
min-height:100vh;
padding:20px;
color:#0f172a;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,0.6);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.7);
border-radius:20px;
padding:20px 28px;
margin-bottom:25px;
flex-wrap:wrap;
gap:15px;
animation:fadeInUp 0.5s ease;
transition:box-shadow 0.3s ease;
box-shadow:0 8px 30px rgba(15,23,42,0.06);
}

.header:hover{
box-shadow:0 4px 16px rgba(0,0,0,0.04);
}

.header h1{
font-size:24px;
font-weight:800;
color:#0f172a;
margin-bottom:2px;
}

.header p{
color:#64748b;
font-size:14px;
font-weight:500;
}

.back-btn{
background:rgba(255,255,255,0.55);
backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);
border:1px solid rgba(226,232,240,0.9);
border-radius:10px;
color:#334155;
text-decoration:none;
font-weight:600;
font-size:13px;
padding:10px 18px;
display:inline-block;
transition:background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}

.back-btn:hover{
background:rgba(245,158,11,0.10);
border-color:rgba(245,158,11,0.3);
transform:translateX(-3px);
box-shadow:0 6px 16px rgba(245,158,11,0.15);
}

.event-card{
background:rgba(255,255,255,0.6);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.7);
border-radius:20px;
padding:28px;
margin-bottom:20px;
animation:fadeInUp 0.5s ease;
transition:transform 0.3s ease, box-shadow 0.3s ease;
box-shadow:0 8px 30px rgba(15,23,42,0.06);
}

.event-card:hover{
transform:translateY(-4px);
box-shadow:0 12px 30px rgba(0,0,0,0.06);
}

.event-card h2{
font-size:20px;
font-weight:800;
color:#0f172a;
margin-bottom:15px;
}

.event-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.event-badge{
display:inline-flex;
align-items:center;
gap:6px;
background:linear-gradient(135deg,#ecfdf5,#d1fae5);
color:#047857;
border:1px solid #a7f3d0;
padding:6px 14px;
border-radius:50px;
font-size:12px;
font-weight:700;
animation:scaleIn 0.4s ease;
}

.event-title{
font-size:22px;
font-weight:800;
color:#0f172a;
margin-bottom:18px;
display:flex;
align-items:center;
gap:10px;
}

.event-info-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:12px;
margin-bottom:20px;
}

.info-chip{
display:flex;
align-items:center;
gap:12px;
background:rgba(255,255,255,0.55);
backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);
border:1px solid rgba(226,232,240,0.9);
border-radius:12px;
padding:12px 14px;
transition:all 0.2s ease;
}

.info-chip:hover{
background:rgba(255,255,255,0.85);
border-color:#dbeafe;
transform:translateY(-2px);
box-shadow:0 8px 18px rgba(59,130,246,0.12);
}

.info-chip > i{
font-size:16px;
color:#d97706;
width:28px;
height:28px;
border-radius:8px;
background:linear-gradient(135deg,#fef3c7,#fde68a);
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
}

.info-chip span{
display:flex;
flex-direction:column;
gap:2px;
min-width:0;
}

.info-chip label{
font-size:11px;
color:#64748b;
font-weight:600;
text-transform:uppercase;
letter-spacing:0.5px;
}

.info-chip b{
font-size:13px;
color:#0f172a;
font-weight:700;
word-break:break-word;
}

.posts-section{
background:rgba(254,243,199,0.45);
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
border:1px solid rgba(253,230,138,0.6);
border-radius:14px;
padding:16px;
margin-top:6px;
}

.posts-title{
font-size:13px;
font-weight:800;
color:#92400e;
text-transform:uppercase;
letter-spacing:0.5px;
display:flex;
align-items:center;
gap:8px;
margin-bottom:12px;
}

.post-chip{
display:flex;
align-items:center;
gap:14px;
background:rgba(255,255,255,0.55);
backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);
border:1px solid rgba(226,232,240,0.9);
border-radius:12px;
padding:14px 16px;
margin-bottom:10px;
transition:all 0.2s ease;
}

.post-chip:last-child{
margin-bottom:0;
}

.post-chip:hover{
border-color:#f59e0b;
box-shadow:0 4px 12px rgba(245,158,11,0.12);
transform:translateX(2px);
}

.chip-icon{
width:40px;
height:40px;
border-radius:12px;
background:linear-gradient(135deg,#3b82f6,#2563eb);
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:16px;
flex-shrink:0;
box-shadow:0 4px 10px rgba(59,130,246,0.25);
}

.chip-body{
flex:1;
min-width:0;
}

.chip-title{
font-size:15px;
font-weight:700;
color:#0f172a;
margin-bottom:6px;
}

.chip-meta{
display:flex;
flex-wrap:wrap;
gap:12px;
}

.chip-meta span{
display:inline-flex;
align-items:center;
gap:6px;
font-size:12px;
color:#475569;
font-weight:500;
}

.chip-meta i{
color:#d97706;
font-size:11px;
}

.no-duty-chip{
display:flex;
align-items:center;
gap:8px;
background:rgba(255,255,255,0.55);
backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);
border:1px dashed rgba(226,232,240,0.9);
border-radius:10px;
padding:12px 14px;
font-size:13px;
color:#64748b;
}

.no-duty-chip i{
color:#d97706;
}

.event-card p{
margin-bottom:8px;
line-height:1.7;
font-size:14px;
color:#475569;
}

.post-box{
background:rgba(255,255,255,0.55);
backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);
border:1px solid rgba(226,232,240,0.9);
border-radius:14px;
padding:18px;
margin-top:18px;
transition:all 0.2s ease;
}

.post-box:hover{
background:rgba(255,255,255,0.85);
border-color:#fde68a;
transform:translateY(-2px);
box-shadow:0 8px 18px rgba(245,158,11,0.12);
}

.post-box h3{
color:#d97706;
margin-bottom:12px;
font-size:14px;
font-weight:700;
}

.post-box p{
margin-bottom:6px;
line-height:1.7;
font-size:14px;
color:#475569;
}

.status{
display:inline-block;
padding:8px 16px;
border-radius:10px;
font-size:12px;
font-weight:700;
margin-top:15px;
animation:scaleIn 0.4s ease;
}

.active{
background:linear-gradient(135deg, #ecfdf5, #d1fae5);
color:#047857;
border:1px solid #a7f3d0;
}

.expired{
background:linear-gradient(135deg, #fef2f2, #fee2e2);
color:#b91c1c;
border:1px solid #fecaca;
}

.no-event{
text-align:center;
padding:60px 40px;
background:rgba(255,255,255,0.6);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.7);
border-radius:20px;
color:#64748b;
animation:fadeInUp 0.5s ease;
box-shadow:0 8px 30px rgba(15,23,42,0.06);
}

.no-event h2{
font-size:20px;
font-weight:700;
color:#0f172a;
margin-bottom:8px;
}

.no-event p{
font-size:14px;
color:#64748b;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div>

<h1>
My Events
</h1>

<p>
Assigned Event Duties
</p>

</div>

<a href="dashboard.html"
class="back-btn">

Back To Dashboard

</a>

</div>

<div id="eventList"></div>

</div>

    <script>
        (function(){ var user = localStorage.getItem('activeStaffUser'); if(!user){ window.location.href = 'login.html'; } })();
    </script>
<script type="module">

import { initializeApp }

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyC8oQaQ051U1lXafwdjjOo38t56WwsdBO4",

authDomain:
"aaq-event-erp.firebaseapp.com",

projectId:
"aaq-event-erp",

storageBucket:
"aaq-event-erp.firebasestorage.app",

messagingSenderId:
"985636664002",

appId:
"1:985636664002:web:4b941d3562609d2058815b"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const currentUser =
JSON.parse(
localStorage.getItem("currentUser")
);

const staffEmail =
(currentUser?.email || "")
.toLowerCase()
.trim();

async function loadEvents(){

const querySnapshot =
await getDocs(
collection(db,"events")
);

let html = "";

querySnapshot.forEach((docItem)=>{

const event =
docItem.data();

const today =
new Date()
.toISOString()
.split("T")[0];

const status =
today > (event.endDate || "")

?

"Expired"

:

"Active";

let matchedPosts = "";

let isMyEvent = false;

const myEventAsCoordinator =
String(event.eventCoordinator || "").toLowerCase().trim() === staffEmail;
const myEventAsAccess =
String(event.accessManager || "").toLowerCase().trim() === staffEmail;

(event.posts || []).forEach((post)=>{

const matched =
(post.staffEmails || []).some(

email =>

email
.toLowerCase()
.trim()

===

staffEmail

);

const myPostCoordinator =
String(post.coordinator || "").toLowerCase().trim() === staffEmail;

if(matched || myPostCoordinator){
isMyEvent = true;

matchedPosts += `

<div class="post-chip">
<span class="chip-icon"><i class="fas fa-briefcase"></i></span>
<div class="chip-body">
<div class="chip-title">${post.crewPost || ""}</div>
<div class="chip-meta">
<span><i class="fas fa-map-marker-alt"></i> ${post.dutyArea || ""}</span>
<span><i class="fas fa-user-cog"></i> ${post.coordinator || ""}</span>
</div>
</div>
</div>

`;

}

});

if(matchedPosts !== "" || myEventAsCoordinator || myEventAsAccess){

if(myEventAsCoordinator || myEventAsAccess){ isMyEvent = true; }

html += `

<div class="event-card">

<div class="event-top">
<div class="event-badge">
<i class="fas fa-calendar-alt"></i> ${status}
</div>
</div>

<h2 class="event-title">
${event.eventName || ""}
</h2>

<div class="event-info-grid">

<div class="info-chip">
<i class="fas fa-map-marker-alt"></i>
<span>
<label>Event Address</label>
<b>${event.eventAddress || ""}</b>
</span>
</div>

<div class="info-chip">
<i class="fas fa-calendar-check"></i>
<span>
<label>Event Validity</label>
<b>${event.startDate || ""} → ${event.endDate || ""}</b>
</span>
</div>

<div class="info-chip">
<i class="fas fa-user-tie"></i>
<span>
<label>Event Coordinator</label>
<b>${event.eventCoordinator || ""}</b>
</span>
</div>

<div class="info-chip">
<i class="fas fa-shield-alt"></i>
<span>
<label>Access Manager</label>
<b>${event.accessManager || ""}</b>
</span>
</div>

<div class="info-chip">
<i class="fas fa-desktop"></i>
<span>
<label>Technical Team</label>
<b>${event.technicalTeam || ""}</b>
</span>
</div>

</div>

<div class="posts-section">
<div class="posts-title">
<i class="fas fa-users"></i> Your Assigned Duty
</div>
${matchedPosts || '<div class="no-duty-chip"><i class="fas fa-info-circle"></i> You are associated with this event as a coordinator.</div>'}
</div>

</div>

`;

}

});

if(html === ""){

html = `

<div class="no-event">

<h2>
No Events Assigned
</h2>

<p>
Currently no event duties available
</p>

</div>

`;

}

document.getElementById(
"eventList"
).innerHTML =
html;

}

loadEvents();

</script>

<!-- Back-button auth guard -->
<script>
    window.addEventListener('pageshow', function(e) {
        if (e.persisted) { window.location.replace(window.location.href); }
    });
    window.addEventListener('popstate', function() {
        var user = localStorage.getItem('activeStaffUser') || localStorage.getItem('currentUser') || localStorage.getItem('userRole');
        if (!user) { window.location.replace('login.html'); }
    });
</script>

<script>
const obs = new IntersectionObserver((entries) => {
    entries.forEach((e, i) => {
        if (e.isIntersecting) { e.target.style.animation = `fadeInUp 0.5s ease ${i * 0.1}s forwards`; e.target.style.opacity = '0'; obs.unobserve(e.target); }
    });
}, { threshold: 0.1 });
document.querySelectorAll('.event-card, .header, .id-card, .info-card, .profile-card').forEach(el => obs.observe(el));
</script>
</body>

</html>
